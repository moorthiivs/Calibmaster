name: Calibmaster CI/CD Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - test
          - production
      calibmaster_url:
        description: 'Frontend Calibmaster URL'
        required: true
      customer_portal_url:
        description: 'Frontend CustomerPortal URL'
        required: true
      db_host:
        description: 'Database Host'
        required: true
      db_name:
        description: 'Database Name'
        required: true
      db_user:
        description: 'Database Username'
        required: true
      db_pass:
        description: 'Database Password'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Frontend
        run: |
          cd frontend
          echo '{
            "Calibmaster": { "URL": "${{ github.event.inputs.calibmaster_url }}" },
            "CustomerPortal": { "URL": "${{ github.event.inputs.customer_portal_url }}" },
            "SRF_ITEM_STATUS_LIST": [
              "Not Calibrated",
              "Calibrated",
              "Report Generated",
              "Dispatched",
              "Report Dispatched",
              "Invoice Generated",
              "Payment Done"
            ]
          }' > src/utils/config.json

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Sync Frontend Build to Backend
        run: |
          cp -r frontend/dist/* backend/public/

      - name: Configure Backend
        run: |
          cd backend
          # Update config/config.json with inputs
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('config/config.json', 'utf8'));
            const env = '${{ github.event.inputs.environment }}';
            conf[env].host = '${{ github.event.inputs.db_host }}';
            conf[env].database = '${{ github.event.inputs.db_name }}';
            conf[env].username = '${{ github.event.inputs.db_user }}';
            conf[env].password = '${{ github.event.inputs.db_pass }}';
            fs.writeFileSync('config/config.json', JSON.stringify(conf, null, 2));
          "

      - name: Deploy (Example - SCP/FTP/Heroku/etc)
        run: |
          echo "Deployment steps go here (e.g., zip and upload, or push to server)"
